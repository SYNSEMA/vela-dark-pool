<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark pool on Vela</title>
<style>
{ raw }
  :root{--ink:#121412;--ink-2:#565a55;--rule:#e3e5e1;--paper:#fbfaf8;--card:#fff;--no:#b23f2e;--no-bg:#fbeeeb;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans)}
  main{max-width:420px;margin:0 auto;padding:64px 20px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  p{color:var(--ink-2);margin:0 0 18px}
  .box{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  label{display:block;font-size:13px;color:var(--ink-2);margin:0 0 4px}
  input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;font:inherit;background:#fff}
  .btn{padding:9px 15px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:500 14px/1 var(--sans);cursor:pointer;margin-top:12px}
  .flash{padding:10px 12px;border-radius:8px;border:1px solid #e9c1c1;margin:0 0 14px;background:var(--no-bg);color:var(--no)}
{ end }
</style>
</head>
<body>
<main>
  <h1>Dark pool on Vela</h1>
  { when needed }
  <p>This console holds every desk's keys. Sign in with the password its operator set (CONSOLE_PASSWORD).</p>
  { when err != "" }<p class="flash">{ err }</p>{ end }
  <form method="post" action="/login" class="box">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit" class="btn">Sign in</button>
  </form>
  { otherwise }
  <p>No password is set: the console is open to whoever reaches it. <a href="/">Go to the seller's desk</a>.</p>
  { end }
</main>
</body>
</html>
