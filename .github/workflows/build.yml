# Tests the app and the client natively, builds the Vela guest from app/app.syn (the release's guest
# module, pinned by hash and by its build provenance, + your program, no compiler), runs the app on
# Vela's own runtime (pkg/wasm, the code the Executor runs) and publishes build/app.wasm.
# Every action is pinned by commit; the tag it was is in the comment.
name: auction guest

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  SYNSEMA_TAG: v0.6.47
  # The guest's hash, the same one scripts/build.sh pins.
  GUEST_SHA256: 133d0f13ea214e7ca572d7c169e0e57b97057df6eb9f832c6ea036d53ac46cb0
  # Vela's runtime the app is tested on (its go.mod pins wasmtime-go v1.0.0, as the Executor does).
  VELA_VERSION: v0.2.1-snapshot1

jobs:
  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install the released Synsema binary (checked against its build provenance)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release download "$SYNSEMA_TAG" -R kitecosmic/synsema --pattern synsema-linux-x86_64 -O synsema
          gh attestation verify synsema --repo kitecosmic/synsema --signer-workflow kitecosmic/synsema/.github/workflows/release.yml
          chmod +x synsema && sudo mv synsema /usr/local/bin/synsema && synsema version
      - name: Test the app and the client natively
        run: |
          synsema test --labels app/app.syn
          synsema check web.syn
          (cd client && synsema test vela_client.syn)
          synsema test scripts/embed.syn
      - name: Fetch the guest and check its build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p .synsema
          gh release download "$SYNSEMA_TAG" -R kitecosmic/synsema --pattern synsema-vela-guest.wasm -O ".synsema/synsema-vela-guest-$SYNSEMA_TAG.wasm"
          gh attestation verify ".synsema/synsema-vela-guest-$SYNSEMA_TAG.wasm" --repo kitecosmic/synsema --signer-workflow kitecosmic/synsema/.github/workflows/release.yml
      - name: Build the module (the pinned guest + app/app.syn)
        run: sh scripts/build.sh
      - name: Smoke under Node WASI (imports, exports, load_module, deploy, determinism)
        run: node scripts/smoke.mjs build/app.wasm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache-dependency-path: tests/vela/go.sum
      - name: The app on Vela's runtime (tests/vela)
        run: cd tests/vela && go test -count=1 -v ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app.wasm
          path: |
            build/app.wasm
            build/app.wasm.sha256
